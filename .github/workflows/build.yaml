name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 make python3 python3-numpy

      - name: Build and test
        run: make

      - name: Upload the C64 program
        uses: actions/upload-artifact@v6
        with:
          name: ChatCBM-C64
          path: |
            build/c64/chatcbm.prg

