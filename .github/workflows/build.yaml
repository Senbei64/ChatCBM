name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 make python3 python3-numpy

      - name: Build and test
        run: make

      - name: Upload the C64 program
        uses: actions/upload-artifact@v6
        with:
          name: ChatCBM-C64
          path: |
            build/c64/chatcbm.prg

      - name: Release the C64 program
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/c64/chatcbm.prg --title "ChatCBM $GITHUB_REF_NAME" --generate-notes

