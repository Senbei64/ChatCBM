#
# ChatCBM on the C64: a PRG from $0801 (BASIC line, program, model image), the BSS up to
# $BFFF, the KV cache at $C000-$FFFF: 16 linear KB, 4 KB of free RAM plus the 12 KB under
# I/O and kernal (used only in compute mode). Enough for up to 4 layers.
#
MEMORY {
    ZP:       file = "", start = $0002, size = $00FE;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $C000 - $0801, define = yes;
    HIRAM:    file = "", start = $C000, size = $4000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    IMAGE:    load = MAIN,     type = ro,  align = $100;
    ALIGNED:  load = MAIN,     type = bss, align = $100, define = yes;
    BSS:      load = MAIN,     type = bss, define = yes;
    KVCACHE:  load = HIRAM,    type = bss;
}

